services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: aigc
      POSTGRES_USER: ahsen
      POSTGRES_PASSWORD: ahsen
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahsen -d aigc"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    environment:
      AIGC_APP_HOST: 0.0.0.0
      AIGC_APP_PORT: 8000
      AIGC_ALCHEMY_URL: postgresql+asyncpg://ahsen:ahsen@postgres:5432/aigc
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

volumes:
  postgres-data:
