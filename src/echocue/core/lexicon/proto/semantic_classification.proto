syntax = "proto3";

package echocue.lexicon;

service SemanticClassification {
  rpc Classify(SemanticClassificationRequest) returns (SemanticClassificationResult);
}

enum SemanticType {
  SEMANTIC_TYPE_UNSPECIFIED = 0;
  SEMANTIC_TYPE_PLAYFUL_JOKE = 1;
  SEMANTIC_TYPE_PERSONA_PRAISE = 2;
  SEMANTIC_TYPE_INTERACTIVE_PROMPT = 3;
  SEMANTIC_TYPE_ATMOSPHERE_BOOST = 4;
  SEMANTIC_TYPE_OTHER = 5;
}

message SemanticClassificationComment {
  string comment_id = 1;
  string text = 2;
}

message SemanticClassificationRequest {
  string room_id = 1;
  repeated string text_batch = 2;
  int32 top_n = 3;
  repeated SemanticClassificationComment comment_batch = 4;
}

message SemanticClassificationCandidate {
  SemanticType semantic_type = 1;
  double score = 2;
  string comment_id = 3;
  string text = 4;
  double confidence = 5;
}

message SemanticClassificationResult {
  SemanticType semantic_type = 1;
  double confidence = 2;
  int32 top_n = 3;
  repeated SemanticClassificationCandidate candidates = 4;
}
